spring.application.name=AureaTPO
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}
spring.jpa.open-in-view=false
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.messaging.order-processing.enabled=${ORDER_PROCESSING_MESSAGING_ENABLED:true}

# Solo health/info quedan expuestos publicamente; el resto de Actuator queda protegido por Spring Security.
management.endpoints.web.exposure.include=health,info