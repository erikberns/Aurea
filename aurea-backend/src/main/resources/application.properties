spring.application.name=AureaTPO
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}
spring.jpa.open-in-view=false
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
# Clave de firma JWT (HS256). El valor por defecto es solo para desarrollo local.
app.jwt.secret=${JWT_SECRET}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Administrador inicial: se crea en el primer arranque solo si ADMIN_PASSWORD tiene valor.
app.admin.email=${ADMIN_EMAIL:admin@aurea.com}
app.admin.password=${ADMIN_PASSWORD:}
app.messaging.order-processing.enabled=${ORDER_PROCESSING_MESSAGING_ENABLED:true}

app.proveedor.url=${PROVEEDOR_SOAP_URL:http://127.0.0.1:8091/soap/proveedor}
app.proveedor.timeout-ms=${PROVEEDOR_TIMEOUT_MS:5000}
app.messaging.reposiciones.enabled=${REPOSICIONES_MESSAGING_ENABLED:true}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Solo health/info quedan expuestos publicamente; el resto de Actuator queda protegido por Spring Security.
management.endpoints.web.exposure.include=health,info

# Detrás de nginx: toma la IP real del cliente de X-Forwarded-For (solo desde proxies de red privada).
server.forward-headers-strategy=native
# Límite de intentos fallidos de login (fuerza bruta): 429 al superarlo, hasta que vence la ventana.
app.seguridad.login.max-fallos-email=${LOGIN_MAX_FALLOS_EMAIL:5}
app.seguridad.login.max-fallos-origen=${LOGIN_MAX_FALLOS_ORIGEN:20}
app.seguridad.login.ventana-segundos=${LOGIN_VENTANA_SEGUNDOS:300}

# Pagos: "simulado" (por defecto, sin red) o "stripe" (modo de prueba, requiere STRIPE_SECRET_KEY=sk_test_...).
app.pagos.proveedor=${PAGOS_PROVEEDOR:simulado}
app.pagos.moneda=${PAGOS_MONEDA:ars}
app.pagos.timeout-ms=${PAGOS_TIMEOUT_MS:5000}
app.pagos.stripe.url=${STRIPE_API_URL:https://api.stripe.com}
app.pagos.stripe.secret-key=${STRIPE_SECRET_KEY:}

# Asistente de descripciones con IA (Clase 14).
# auto: usa Gemini si hay IA_API_KEY y, si no, el modelo simulado (sin red). simulado | gemini fuerzan uno.
app.ia.proveedor=${IA_PROVEEDOR:auto}
app.ia.api-key=${IA_API_KEY:}
# Identificador del modelo tal como figura en Google AI Studio (los nombres cambian seguido).
app.ia.modelo=${IA_MODELO:gemini-3.8-flash}
app.ia.url=${IA_API_URL:https://generativelanguage.googleapis.com}
# Plan de apagado: IA_HABILITADA=false deja el formulario en modo manual sin tocar el código.
app.ia.habilitada=${IA_HABILITADA:true}
# 8 s: en las pruebas, Gemini gratuito respondió en 1,8 a 4,4 s más la red (ver ADR-009).
app.ia.timeout-ms=${IA_TIMEOUT_MS:8000}
# Cuánto "razona" Gemini antes de responder (minimal, low, medium, high). Por defecto el modelo usa high,
# que es lento para una descripción corta. Vacío no envía el parámetro.
app.ia.nivel-razonamiento=${IA_NIVEL_RAZONAMIENTO:low}
app.ia.max-solicitudes-por-minuto=${IA_MAX_SOLICITUDES_POR_MINUTO:10}
# Precio por millón de tokens, para estimar el costo en las trazas (0 en el plan gratuito).
app.ia.costo-entrada-usd-por-millon=${IA_COSTO_ENTRADA_USD:0}
app.ia.costo-salida-usd-por-millon=${IA_COSTO_SALIDA_USD:0}

# La API no recibe archivos: sin multipart, un pedido multipart/form-data responde 415 y no 500.
spring.servlet.multipart.enabled=false
