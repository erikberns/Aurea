spring.application.name=AureaTPO
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}
spring.jpa.open-in-view=false
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
# Clave de firma JWT (HS256). El valor por defecto es solo para desarrollo local.
app.jwt.secret=${JWT_SECRET:aurea-joyas-secret-key-2026-hs256-seguridad-tpo-uade}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.messaging.order-processing.enabled=${ORDER_PROCESSING_MESSAGING_ENABLED:true}

app.proveedor.url=${PROVEEDOR_SOAP_URL:http://127.0.0.1:8091/soap/proveedor}
app.proveedor.timeout-ms=${PROVEEDOR_TIMEOUT_MS:5000}
app.messaging.reposiciones.enabled=${REPOSICIONES_MESSAGING_ENABLED:true}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Solo health/info quedan expuestos publicamente; el resto de Actuator queda protegido por Spring Security.
management.endpoints.web.exposure.include=health,info

# Pagos: "simulado" (por defecto, sin red) o "stripe" (modo de prueba, requiere STRIPE_SECRET_KEY=sk_test_...).
app.pagos.proveedor=${PAGOS_PROVEEDOR:simulado}
app.pagos.moneda=${PAGOS_MONEDA:ars}
app.pagos.timeout-ms=${PAGOS_TIMEOUT_MS:5000}
app.pagos.stripe.url=${STRIPE_API_URL:https://api.stripe.com}
app.pagos.stripe.secret-key=${STRIPE_SECRET_KEY:}
