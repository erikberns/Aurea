spring.datasource.url=jdbc:h2:mem:aurea;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.rabbitmq.listener.simple.auto-startup=false
app.messaging.order-processing.enabled=false
app.messaging.reposiciones.enabled=false
# Valores solo para pruebas automatizadas (no son credenciales reales).
app.jwt.secret=solo-para-pruebas-automatizadas-no-usar-en-produccion
spring.rabbitmq.username=pruebas
spring.rabbitmq.password=pruebas
app.admin.email=admin@aurea.com
app.admin.password=solo-para-pruebas
# Las pruebas usan siempre el modelo simulado, aunque el entorno tenga IA_API_KEY.
app.ia.proveedor=simulado
