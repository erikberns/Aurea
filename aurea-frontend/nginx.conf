server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No publicar la versión de nginx en cabeceras ni páginas de error.
    server_tokens off;

    # --- Cabeceras de seguridad (OWASP A05). "always" las agrega también en respuestas de error. ---
    # CSP: solo scripts propios; estilos y fuentes de Google Fonts; imágenes propias o por HTTPS
    # (fotos del catálogo); la API está en el mismo origen. 'unsafe-inline' solo en estilos.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # HSTS: el navegador solo la respeta cuando el sitio se sirve por HTTPS (detrás de un proxy TLS en producción).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # API del backend en el mismo origen: evita CORS y problemas de cookies SameSite.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # Spring Security ya envía estas dos; se ocultan para que no salgan duplicadas con las de arriba.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
    }

    # Archivos generados por Vite (nombre con hash): se pueden cachear mucho tiempo.
    # add_header dentro de un location reemplaza las del server, por eso se repiten las de seguridad.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Rutas de la SPA (React Router): cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
