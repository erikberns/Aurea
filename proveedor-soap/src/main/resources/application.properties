spring.application.name=ProveedorSOAP
spring.main.web-application-type=none
spring.datasource.url=${PROVEEDOR_DB_URL:jdbc:h2:file:./data/proveedor}
spring.datasource.username=sa
spring.datasource.password=${PROVEEDOR_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
proveedor.endpoint=${PROVEEDOR_ENDPOINT:http://127.0.0.1:8091/soap/proveedor}
