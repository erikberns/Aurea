name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (Maven + JaCoCo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aurea-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Ejecutar pruebas y generar cobertura (JaCoCo)
        run: ./mvnw -B test jacoco:report

      - name: Resumen de cobertura parcial
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            echo "### Reporte de cobertura parcial (JaCoCo)" >> $GITHUB_STEP_SUMMARY
            awk -F',' 'NR>1 { missed+=$4; covered+=$5 } END { total=missed+covered; if (total>0) printf "- **Instrucciones cubiertas:** %d / %d (**%.2f%%**)\n", covered, total, (covered/total)*100 }' target/site/jacoco/jacoco.csv >> $GITHUB_STEP_SUMMARY
          fi

      - name: Subir reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: aurea-backend/target/site/jacoco/

  frontend:
    name: Frontend (Lint + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aurea-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aurea-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linter
        run: npm run lint

      - name: Compilar bundle de producción
        run: npm run build
